<!-- layouts/_partials/blocks/download-tile.html -->
<section class="max-w-sm p-6 bg-white rounded-lg shadow-md text-center">
  <div class="mb-4">
    {{- if .icon }}
    <svg class="mx-auto h-12 w-12 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <use xlink:href="#icon-{{ .icon }}"></use>
    </svg>
    {{- end }}
  </div>
  <h3 class="text-lg font-semibold text-gray-900 mb-2">{{ .title }}</h3>
  <p class="text-gray-600 mb-6">{{ .description }}</p>
  <div class="flex justify-center space-x-4">
    {{- range .buttons }}
    <a href="{{ .url }}" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-md hover:bg-indigo-700 transition" target="_blank" rel="noopener noreferrer">
      {{- if .icon }}
      <svg class="-ml-1 mr-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <use xlink:href="#icon-{{ .icon }}"></use>
      </svg>
      {{- end }}
      {{ .label }}
    </a>
    {{- end }}
  </div>
</section>
